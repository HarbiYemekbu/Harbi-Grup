<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0b1f3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Harbi Kurye" />
    <meta name="description" content="Harbi Kurye — barkod zimmet, rota, kod teslim" />
    <title>Harbi Kurye</title>
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="manifest" href="kargo-kurye.webmanifest" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/kargo.css" />
  </head>
  <body data-page="courier">
    <section class="hk-auth" id="kyAuthGate" hidden>
      <div class="hk-auth-card">
        <div class="hk-auth-brand">
          <svg class="hk-logo" viewBox="0 0 192 192" aria-hidden="true">
            <rect width="192" height="192" rx="42" fill="#0b1f3a" />
            <path fill="#f26b1d" d="M28 118h136l-18 32H46z" />
            <rect x="40" y="70" width="92" height="48" rx="8" fill="#fff" />
            <rect x="132" y="88" width="28" height="30" rx="6" fill="#e8b84a" />
            <circle cx="62" cy="128" r="14" fill="#123056" />
            <circle cx="138" cy="128" r="14" fill="#123056" />
          </svg>
          <div>
            <h1>Harbi Kurye</h1>
            <p>Giriş Harbi Kargo üzerinden yapılır.</p>
          </div>
        </div>
        <a class="orange hk-auth-cta" href="kargo.html">Harbi Kargo girişi</a>
        <a class="hk-auth-back" href="index.html">Harbi Grup</a>
      </div>
    </section>

    <div class="ky-stage" id="kyShell" hidden>
      <div class="ky-screen">
        <header class="ky-screen-top">
          <div>
            <strong>Harbi Kurye</strong>
            <small id="kyBranchLabel">Rota</small>
          </div>
          <button type="button" id="kyLogout">Çıkış</button>
        </header>

        <nav class="ky-tabs" role="tablist">
          <button type="button" class="ky-tab on" id="kyTabRoute" data-ky-tab="route">Ana rota</button>
          <button type="button" class="ky-tab" id="kyTabScan" data-ky-tab="scan">Barkod</button>
        </nav>

        <p class="msg" id="kyRouteMsg"></p>

        <section class="ky-panel on" id="kyPanelRoute" data-ky-panel="route">
          <div class="ky-route-head">
            <h1>Otomatik rota</h1>
            <span id="kyRouteMeta"></span>
          </div>
          <div id="kyZimmetList" class="ky-zimmet-list"></div>

          <section class="ky-failed-sec" id="kyFailedSec">
            <h2>Teslim edilemedi</h2>
            <div id="kyFailedList" class="ky-failed-list"></div>
          </section>

          <section class="ky-pay-summary" id="kyPaySummary">
            <h2>Kod ile teslim</h2>
            <div class="ky-pay-stats" id="kyPayStats"></div>
            <div id="kyCodeDeliveredList" class="ky-code-delivered-list"></div>
          </section>
        </section>

        <section class="ky-panel" id="kyPanelScan" data-ky-panel="scan" hidden>
          <div class="ky-scan-modes" role="group" aria-label="Barkod amacı">
            <button type="button" class="ky-scan-mode on" id="kyScanModeZimmet" data-scan-mode="zimmet">Zimmete al</button>
            <button type="button" class="ky-scan-mode" id="kyScanModeTeslim" data-scan-mode="teslim">Teslim için okut</button>
          </div>

          <div class="ky-cam-wrap">
            <video id="kyCamVideo" playsinline muted autoplay></video>
            <canvas id="kyCamCanvas" hidden></canvas>
            <div class="ky-cam-frame" aria-hidden="true"></div>
          </div>

          <div class="ky-cam-actions">
            <button type="button" class="orange" id="kyCamStart">Kamerayı aç</button>
            <button type="button" class="secondary" id="kyCamStop" disabled>Durdur</button>
          </div>

          <label class="field ky-manual-code">Kod (elle)
            <input id="kyManualCode" inputmode="numeric" maxlength="8" placeholder="4801" autocomplete="off" />
          </label>
          <button type="button" class="orange" id="kyManualApply">Kodu uygula</button>
          <p class="msg" id="kyCamMsg"></p>
        </section>
      </div>
    </div>
    <script src="js/kargo.js"></script>
  </body>
</html>
